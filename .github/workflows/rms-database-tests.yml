name: RMS database foundation
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/rms-database-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/rms-database-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: rms_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: rms_test
      DB_USER: rms_ci
      DB_PASSWORD: ephemeral-ci-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DEBUG: 'True'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py seed_demo
      - run: python manage.py test accounts booking menu orders --verbosity=2
