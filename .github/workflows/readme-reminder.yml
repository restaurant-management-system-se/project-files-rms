name: README Update Reminder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "SRS/**"
      - "Test-Plan/**"
      - "Design-Documents/**"

permissions:
  pull-requests: write

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Add README reminder comment
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## README Update Reminder

            Please update \`README.md\` after every change or upload to the project documents.

            Make sure the README reflects:
            - Newly added or removed documents
            - Updated document statuses
            - Changes to the repository structure
            - Relevant document descriptions`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

            const existingComment = comments.find(comment =>
              comment.user.type === "Bot" &&
              comment.body.includes("README Update Reminder")
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
