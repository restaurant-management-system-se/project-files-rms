name: README Update Reminder
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'SRS and Test Plan Details/**'
      - 'Software Design And Architecture Specification/**'
      - 'Test Cases related to Test Plan/**'
      - 'Issues/Backlog/**'
      - 'quality/**'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: readme-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reminder:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update one README reminder without duplicate comments
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rms-readme-reminder -->';
            const message = `${marker}\n## README Update Reminder\n\nPlease check README.md for document names, status and structure affected by this PR. Keep requirement/test links current; do not mark pending tests passed.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' &&
              (c.body.includes(marker) || c.body.includes('## README Update Reminder')));
            if (existing) {
              if (existing.body !== message) await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: message
              });
            }
