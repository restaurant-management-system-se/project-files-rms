<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage menu</title>
<style>body{font:1rem system-ui;max-width:65rem;margin:2rem auto;padding:1rem}label{display:block;margin:.6rem}input,select,textarea,button{font:inherit;padding:.5rem}article{padding:1rem;border-bottom:1px solid #aaa}</style>
<h1>Manage menu</h1><a href="/menu/">Customer menu</a><p id="message" role="status"></p>
<form id="editor">{% csrf_token %}<input type="hidden" id="itemId"><label>Name <input id="name" required maxlength="120"></label><label>Description <textarea id="description" maxlength="2000"></textarea></label><label>Price <input id="price" type="number" min="0" step=".01" required></label><label>Category <select id="category"><option>Starters</option><option>Main Course</option><option>Desserts</option><option>Beverages</option></select></label><label>Available <input type="checkbox" id="available" checked></label><button>Save item</button><button type="reset">New item</button></form><section id="items"></section>
<script>
const byId=id=>document.getElementById(id), message=byId('message');
async function api(url, method='GET', data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:data?JSON.stringify(data):undefined});const d=r.status===204?null:await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d;}
async function load(){try{const items=await api('/api/admin/menu');byId('items').replaceChildren();for(const item of items){const row=document.createElement('article'),label=document.createElement('p');label.textContent=`${item.name} — ${item.category} — ${item.price} — ${item.available?'Available':'Unavailable'}`;row.append(label);const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{byId('itemId').value=item.id;for(const k of ['name','description','price','category'])byId(k).value=item[k];byId('available').checked=item.available;};const del=document.createElement('button');del.textContent='Delete / preserve history';del.onclick=async()=>{try{await api('/api/admin/menu/'+item.id,'DELETE');await load();}catch(e){message.textContent=e.message;}};row.append(edit,del);byId('items').append(row);}}catch(e){message.textContent=e.message;}}
byId('editor').onsubmit=async e=>{e.preventDefault();const id=byId('itemId').value,data={};for(const k of ['name','description','price','category'])data[k]=byId(k).value;data.available=byId('available').checked;try{await api('/api/admin/menu'+(id?'/'+id:''),id?'PATCH':'POST',data);message.textContent='Saved';await load();}catch(e){message.textContent=e.message;}};load();
</script></html>
