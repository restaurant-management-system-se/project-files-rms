<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant menu</title><style>body{font:1rem system-ui;max-width:65rem;margin:auto;padding:1rem}.dishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}article{padding:1rem;border:1px solid #aaa;border-radius:.5rem}button{padding:.6rem;font:inherit}</style><h1>Restaurant menu</h1><nav><a href="/book/">Book a table</a> · <a href="/account/">Account</a></nav><p id="message" role="status"></p><main id="menu"></main><script>
async function loadMenu(){try{const r=await fetch('/api/menu',{cache:'no-store'});if(!r.ok)throw Error('Could not load menu.');const d=await r.json();document.getElementById('menu').replaceChildren();for(const group of d.categories){const section=document.createElement('section'),h=document.createElement('h2'),list=document.createElement('div');h.textContent=group.category;section.append(h);list.className='dishes';if(!group.items.length){const p=document.createElement('p');p.textContent='No dishes available in this category.';list.append(p);}for(const item of group.items){const row=document.createElement('article');row.dataset.itemId=item.id;for(const [tag,text] of [['h3',item.name],['p',item.description],['p',item.price]]){const el=document.createElement(tag);el.textContent=text;row.append(el);}list.append(row);}section.append(list);document.getElementById('menu').append(section);}}catch(e){document.getElementById('message').textContent=e.message;}}loadMenu();
</script></html>
