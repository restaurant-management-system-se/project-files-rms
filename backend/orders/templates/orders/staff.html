<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order queue</title><style>body{font:1rem system-ui;max-width:65rem;margin:auto;padding:1rem}article{border:1px solid #aaa;margin:1rem 0;padding:1rem}button,select{font:inherit;padding:.6rem}</style><h1>Order queue</h1>{% csrf_token %}<label>Status <select id="filter"><option>Received</option><option>Preparing</option><option>Served</option></select></label><button id="refresh">Refresh</button><button id="previous">Previous</button><button id="next">Next</button><p id="message" role="status"></p><main id="orders"></main><script>
let page=1;const $=id=>document.getElementById(id);async function load(){try{const r=await fetch('/api/staff/orders?status='+encodeURIComponent($('filter').value)+'&page='+page);const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));$('orders').replaceChildren();$('message').textContent=`Page ${page}; ${d.total} orders`;$('previous').disabled=page===1;$('next').disabled=page*25>=d.total;for(const order of d.orders){const row=document.createElement('article'),text=document.createElement('p');text.textContent=`Order ${order.id} — ${order.status} — ${order.total_amount} — `+order.items.map(i=>`${i.name} × ${i.quantity}`).join(', ');row.append(text);const next={Received:'Preparing',Preparing:'Served'}[order.status];if(next){const b=document.createElement('button');b.textContent='Move to '+next;b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/staff/orders/'+order.id+'/status',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify({status:next,expected_version:order.version})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));await load();}catch(e){$('message').textContent=e.message;b.disabled=false;}};row.append(b);}$('orders').append(row);}}catch(e){$('message').textContent=e.message;}}$('filter').onchange=()=>{page=1;load();};$('refresh').onclick=load;$('previous').onclick=()=>{page--;load();};$('next').onclick=()=>{page++;load();};load();
</script></html>
