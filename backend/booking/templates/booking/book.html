{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a table · RMS</title>
<style>body{font:17px system-ui;background:#f5f2ec;color:#20322b;margin:0}main{max-width:760px;margin:3rem auto;padding:2rem;background:white;border-radius:18px}label{display:block;margin:1rem 0}input,button{font:inherit;padding:.7rem;border:1px solid #8b9b91;border-radius:6px}button{cursor:pointer;background:#165e46;color:white}button:disabled{opacity:.6}#results button{margin:.4rem}#message{white-space:pre-line;color:#92330f}small{display:block}a{color:#165e46}</style></head><body><main>
<p>RESTAURANT MANAGEMENT SYSTEM</p><h1>Find your table</h1><p>Choose a date, time and number of guests. Times use your device's timezone.</p>
<form id="search">{% csrf_token %}<label>Date and time <input id="start" type="datetime-local" required aria-describedby="message"></label><label>Guests <input id="guests" type="number" min="1" max="32767" value="2" required aria-describedby="message"></label><button>Check availability</button></form>
<p id="message" role="alert"></p><section id="results" aria-live="polite"></section>
<p>Availability can change before confirmation.</p>
</main><script src="{% static 'booking/book.js' %}" defer></script></body></html>
